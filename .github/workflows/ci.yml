name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # The unit & integration step alone took 19.7 min (ubuntu) and 22.4 min (windows) on Node 22 in run 38777566530,
    # and more tests ran to the end once the Windows failures were fixed: 25 minutes left no margin.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 22 and 24 = the maintained LTS lines (24 is what `winget install OpenJS.NodeJS.LTS` installs today)
        node: [22, 24]
    env:
      # Browser/E2E suites gate themselves on these (and on a local Chrome + downloaded game assets, which CI never
      # has): keep them off explicitly. Suites that need .cache/gamedata, public/assets or data/local-assets.json skip.
      SP_E2E: '0'
      SP_REAL_E2E: '0'
      RENDER_E2E: '0'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (npm ci → postinstall copies public/vendor)
        run: npm ci --no-audit --no-fund

      - name: Install zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install zip -y --no-progress

      - name: Setup check (no downloads)
        run: node tools/setup.mjs --check --no-local

      # package.json "test": node --test over the test files. A bare `node --test` would also run every helper and
      # fixture under test/ (Node's default patterns take any .js there for a test file).
      - name: Unit & integration tests
        run: npm run test

      - name: Server smoke test (boot, /healthz, index.html, doctor)
        shell: bash
        run: |
          node server/index.js > server.log 2>&1 &
          pid=$!
          ok=
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz; then ok=1; break; fi
            sleep 1
          done
          echo
          [ -n "$ok" ] || { cat server.log; exit 1; }
          # Save the page first: piping curl into `grep -q` let grep exit on the first match, curl then failed with a
          # write error (23) and pipefail turned that into a flaky red step.
          curl -fsS -o index.out http://127.0.0.1:3000/
          grep -qi '<html' index.out
          curl -fsS -o /dev/null http://127.0.0.1:3000/vendor/pixi.min.js
          node tools/doctor.mjs || true
          kill $pid || true

  # Separate from the test matrix so lint / types / import boundaries run once, not four times.
  # Lint warnings do not fail the job (npm run lint does not pass --max-warnings=0).
  tooling:
    name: tooling (lint, imports, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install (npm ci → postinstall copies public/vendor)
        run: npm ci --no-audit --no-fund

      - name: Lint (warnings allowed)
        run: npm run lint

      - name: Import boundaries
        run: npm run check:imports

      - name: Typecheck
        run: npm run typecheck

  # ─────────────────────────────────────────────────────────────────────────────
  # 真装载门（本仓此前没有显式的一道）
  # `npm run test` 会顺带跑到这两个文件，但它们红在 4 个矩阵里的某一条时，看上去和
  # 「某个单测挂了」没区别；而它们回答的是**完全不同**的问题：插件到底装不装得上。
  # 这里单独成 job：① 文件不在 = 判据失效（不是绿）；② 一条用例都没跑 = 判据失效；
  # ③ `plugin-host.test.js` 里的 `errorCount === 0` 断言被删掉也算红 —— 那是「装载无错」的判据本身。
  # ─────────────────────────────────────────────────────────────────────────────
  plugin-load:
    name: plugin-load (插件真装载 + 对局宿主无错)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (npm ci → postinstall copies public/vendor)
        run: npm ci --no-audit --no-fund

      # 逻辑在 tools/plugin-load.mjs 里（本仓规矩：ci.yml 的每一步都要在 tools/ci.mjs 有对应实现，
      # 把三步收成一行命令，本地跑 `node tools/ci.mjs` 时也能跑同一份判据）
      - name: Plugin load (registry + match host, real boot)
        run: node tools/plugin-load.mjs
